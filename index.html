<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobi</title>
    <meta name="description" content="Studio Hobi — a design studio based in the Catskills, working with clients in New York City and beyond." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts: Cormorant Garamond (placeholder for GT Alpina) + Inter (placeholder for Tonka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Feed layout (desktop). One column of figures; each is pinned to the left or right
         edge, so consecutive images zig-zag, and --mt (set per photo by plugins/feed.js)
         sets how far each one is pushed down. 12px = gutter between the two columns. */
      @media (min-width: 40rem) {
        .feed-wrap { container-type: inline-size; }
        .feed-item { margin-top: var(--mt, 0px); }
        .feed-left { align-self: flex-start; width: calc((100% - 12px) * 0.44); }
        .feed-right { align-self: flex-end; width: calc((100% - 12px) * 0.56); }
      }
    </style>
  </head>
  <body class="bg-white text-black antialiased">
    <!-- Top bar: HOBI wordmark left, nav anchored to the right edge of the viewport
         (no max-width on the inner row, so the nav follows the gutter, not the grid). -->
    <header class="pl-[17px] pr-[40px] pt-6 sm:pt-8">
      <div class="flex items-start justify-between">
        <h1 class="font-display text-[40px] font-light leading-none tracking-tight sm:text-[54px]">
          HOBI
        </h1>
        <nav class="flex gap-8 pt-3 text-[11px] font-medium leading-[14px]">
          <a href="#about" class="transition hover:opacity-60">About</a>
          <a href="mailto:info@studiohobi.com" class="transition hover:opacity-60">info@studiohobi.com</a>
        </nav>
      </div>
    </header>

    <!-- Image feed. The photos come from content/feed.json (edit them at /admin, the CMS), and
         a build step (plugins/feed.js) writes the <figure> tags in where the FEED_ITEMS comment is.
         On desktop the photos alternate left / right and cascade down the page; on mobile they
         stack in the same order. Captions appear on hover, desktop only. -->
    <main class="pl-[17px] pr-[40px] pt-16 sm:pt-24">
      <div class="feed-wrap max-w-[1346px]">
        <div class="feed flex flex-col gap-y-16 sm:gap-y-0">
        <!-- FEED_ITEMS -->
        </div>
      </div>
    </main>

    <!-- About — anchor target for the nav link. Subhead is now Inter, small. -->
    <section id="about" class="scroll-mt-8 pl-[17px] pr-[40px] pt-32 sm:pt-48">
      <div class="max-w-[640px]">
        <h2 class="text-[14px] font-medium leading-[1.4]">About</h2>
        <p class="mt-4 text-[15px] leading-[1.6] sm:text-base">
          Studio Hobi is a design studio based in the Catskills, working with
          clients in upstate New York, The Hudson Valley, New York City and beyond. Studio Hobi is Nick Simmons and
          Mara Lookabaugh.
        </p>
      </div>
    </section>

    <!-- Footer — left-anchored to the same gutter, no top border. -->
    <footer class="mt-32 pb-10 pl-[17px] pr-[40px] pt-10 sm:pb-14 sm:pt-14">
      <div class="flex max-w-[1346px] flex-col items-start justify-between gap-4 text-[11px] font-medium leading-[14px] sm:flex-row sm:items-end">
        <p>&copy; <span id="year"></span> Studio Hobi</p>
        <div class="flex gap-8">
          <a href="mailto:info@studiohobi.com" class="transition hover:opacity-60">info@studiohobi.com</a>
          <a href="https://instagram.com/studio_hobi" class="transition hover:opacity-60" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
