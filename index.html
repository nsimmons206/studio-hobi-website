<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobi</title>
    <meta name="description" content="Studio Hobi — a design studio based in the Catskills, working with clients in New York City and beyond." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts: Cormorant Garamond (placeholder for GT Alpina) + Inter (placeholder for Tonka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Feed layout (desktop). One column of figures; each is pinned to the left or right
         edge, so consecutive images zig-zag and --mt (see comment in the feed) sets how far
         each one is pushed down. 12px = gutter between the two columns. */
      @media (min-width: 40rem) {
        .feed-wrap { container-type: inline-size; }
        .feed-item { margin-top: var(--mt, 0px); }
        .feed-left { align-self: flex-start; width: calc((100% - 12px) * 0.44); }
        .feed-right { align-self: flex-end; width: calc((100% - 12px) * 0.56); }
      }
    </style>
  </head>
  <body class="bg-white text-black antialiased">
    <!-- Top bar: HOBI wordmark left, nav anchored to the right edge of the viewport
         (no max-width on the inner row, so the nav follows the gutter, not the grid). -->
    <header class="pl-[17px] pr-[40px] pt-6 sm:pt-8">
      <div class="flex items-start justify-between">
        <h1 class="font-display text-[40px] font-light leading-none tracking-tight sm:text-[54px]">
          HOBI
        </h1>
        <nav class="flex gap-8 pt-3 text-[11px] font-medium leading-[14px]">
          <a href="#about" class="transition hover:opacity-60">About</a>
          <a href="mailto:info@studiohobi.com" class="transition hover:opacity-60">info@studiohobi.com</a>
        </nav>
      </div>
    </header>

    <!-- Image feed. The images are listed in the order they appear, and they alternate
         left / right on desktop (on mobile they stack in this same order).
         Each figure has a --mt value that sets its vertical position: it is how far the
         image's top edge sits above (negative) or below (positive) the bottom of the image
         before it, in "cqw" (percent of the feed width, so it scales with the window).
         Lower number = higher up. Later images follow along, so moving one moves the rest.
         Width/height attributes on each <img> hold the photo's pixel size so the page
         doesn't jump around while images load. Captions appear on hover, desktop only. -->
    <main class="pl-[17px] pr-[40px] pt-16 sm:pt-24">
      <div class="feed-wrap max-w-[1346px]">
        <div class="feed flex flex-col gap-y-16 sm:gap-y-0">
        <figure class="group feed-item feed-left">
          <img src="/images/01.jpg" alt="" width="1158" height="1725" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Field stool in Ash.</figcaption>
        </figure>
        <figure class="group feed-item feed-right" style="--mt:-20.74cqw">
          <img src="/images/02.jpg" alt="" width="1476" height="1141" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Sample House design library - design and build out.</figcaption>
        </figure>
        <figure class="group feed-item feed-left" style="--mt:-0.95cqw">
          <img src="/images/09.jpg" alt="" width="1200" height="1800" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block"></figcaption>
        </figure>
        <figure class="group feed-item feed-right" style="--mt:-20.68cqw">
          <img src="/images/10.jpg" alt="" width="1800" height="1200" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block"></figcaption>
        </figure>
        <figure class="group feed-item feed-left" style="--mt:4.95cqw">
          <img src="/images/11.jpg" alt="" width="1166" height="1800" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block"></figcaption>
        </figure>
        <figure class="group feed-item feed-right" style="--mt:-21.22cqw">
          <img src="/images/03.jpg" alt="" width="1158" height="1785" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Eyebrow window trim and siding in cedar.</figcaption>
        </figure>
        <figure class="group feed-item feed-left" style="--mt:-26.37cqw">
          <img src="/images/04.jpg" alt="" width="1476" height="2024" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Wuthering side table in contrast stained white oak.</figcaption>
        </figure>
        <figure class="group feed-item feed-right" style="--mt:-12.37cqw">
          <img src="/images/05.jpg" alt="" width="579" height="797" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Bedroom closet in painted red oak. Carved pulls in white oak.</figcaption>
        </figure>
        <figure class="group feed-item feed-left" style="--mt:-23.78cqw">
          <img src="/images/06.jpg" alt="" width="1476" height="1298" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Kitchen in painted poplar.</figcaption>
        </figure>
        <figure class="group feed-item feed-right" style="--mt:6.69cqw">
          <img src="/images/07.jpg" alt="" width="1158" height="1486" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Double bench in white oak.</figcaption>
        </figure>
        <figure class="group feed-item feed-left" style="--mt:-22.32cqw">
          <img src="/images/08.jpg" alt="" width="1476" height="2194" class="block h-auto w-full" loading="lazy" onerror="this.style.display='none'" />
          <figcaption class="mt-3 hidden text-center text-[11px] font-medium leading-[14px] text-stone-500 opacity-0 transition-opacity duration-200 group-hover:opacity-100 sm:block">Double bench and wood storage.</figcaption>
        </figure>
        </div>
      </div>
    </main>

    <!-- About — anchor target for the nav link. Subhead is now Inter, small. -->
    <section id="about" class="scroll-mt-8 pl-[17px] pr-[40px] pt-32 sm:pt-48">
      <div class="max-w-[640px]">
        <h2 class="text-[14px] font-medium leading-[1.4]">About</h2>
        <p class="mt-4 text-[15px] leading-[1.6] sm:text-base">
          Studio Hobi is a design studio based in the Catskills, working with
          clients in upstate New York, The Hudson Valley, New York City and beyond. Studio Hobi is Nick Simmons and
          Mara Lookabaugh.
        </p>
      </div>
    </section>

    <!-- Footer — left-anchored to the same gutter, no top border. -->
    <footer class="mt-32 pb-10 pl-[17px] pr-[40px] pt-10 sm:pb-14 sm:pt-14">
      <div class="flex max-w-[1346px] flex-col items-start justify-between gap-4 text-[11px] font-medium leading-[14px] sm:flex-row sm:items-end">
        <p>&copy; <span id="year"></span> Studio Hobi</p>
        <div class="flex gap-8">
          <a href="mailto:info@studiohobi.com" class="transition hover:opacity-60">info@studiohobi.com</a>
          <a href="https://instagram.com/studio_hobi" class="transition hover:opacity-60" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
